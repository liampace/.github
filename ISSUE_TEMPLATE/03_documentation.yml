name: Documentation
description: A comment, tutorial, or other important information
title: "docs: <title>"
labels: ["type: documentation"]
body:
- type: textarea
  attributes:
    label: What part of the documentation needs to be updated? Please describe
    description: A clear and concise description of what the documentation is. Ex. Added a tutorial for [...]
  validations:
    required: true
- type: textarea
  attributes:
    label: Why does the documentation needs to be updated? Please describe
    description: A clear and concise description of the importance of the update.
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional Context
    description: Add any other context here.
  validations:
    required: false
