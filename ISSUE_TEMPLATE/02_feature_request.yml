name: Feature Request
description: Suggest an new idea or enhancement for this project
title: "feat: <title>"
labels: ["type: feature"]
body:
- type: textarea
  attributes:
    label: Is your feature request related to a problem? Please describe.
    description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe the solution you'd like
    description: A clear and concise description of what you want to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe alternatives you've considered
    description: A clear and concise description of any alternative solutions or features you've considered and why they are insufficient.
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional Context
    description: Add any other context here.
  validations:
    required: false
