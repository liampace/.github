name: Bug Report
description: Create a report to help us improve.
title: "fix: <title>"
labels: ["type: bug"]
body:
- type: textarea
  attributes:
    label: Current Behavior
    description: A clear and concise description of what the bug is.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: A concise description of what you expected to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps To Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. In this environment...
      1. With this config...
      1. Run '...'
      1. See error...
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional Context
    description: Add any other context here. Useful items include images, log files, crash-reports, etc.
  validations:
    required: false
